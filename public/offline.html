<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a08b7a">
  <title>Sin conexion - ChanaDomus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f0eb;
      color: #44403c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 24rem;
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background-color: #a08b7a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 2rem;
      height: 2rem;
      color: #fff;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #292524;
      margin-bottom: 0.5rem;
    }
    .brand {
      font-size: 0.875rem;
      font-weight: 500;
      color: #a08b7a;
      margin-bottom: 1.5rem;
      letter-spacing: 0.025em;
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #57534e;
      margin-bottom: 2rem;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.625rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #fff;
      background-color: #a08b7a;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    button:hover { background-color: #8a7566; }
    button:active { background-color: #746252; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 18.75h.008v.008H12v-.008Z" />
      </svg>
    </div>
    <div class="brand">ChanaDomus</div>
    <h1>Sin conexion</h1>
    <p>No se pudo conectar al servidor. Verifica tu conexion a internet e intenta de nuevo.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
