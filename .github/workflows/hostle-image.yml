# Imagen para Hostle (servidores ARM de Hetzner). Corre las pruebas y publica
# ghcr.io/neskeep/chanadomus:sha-<commit> y :arm64. No despliega: el despliegue se hace a mano
# en hostle-apps con `deploy.sh chanadomus <sha>`.
name: Imagen ARM64 para Hostle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/neskeep/chanadomus

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm vitest run

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
