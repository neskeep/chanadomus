# Imagen para Hostle (servidores ARM de Hetzner). No toca `latest` ni el despliegue a Coolify:
# publica solo etiquetas propias (`sha-<commit>` y `arm64`) en ghcr.io/neskeep/chanadomus.
name: Imagen ARM64 para Hostle

on:
  push:
    branches: [hosting/arm64-ghcr]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/neskeep/chanadomus

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
