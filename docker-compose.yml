services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chanadomus
      POSTGRES_USER: chanadomus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chanadomus_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanadomus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
